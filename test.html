<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wrdhelpr Test</title>
    <style>
        body {
            padding: 10px;
            font-family: Courier New;
        }

        form {
            width: 100%;
            border: 5px solid tomato;
            background-color: blanchedalmond;
            border-radius: 20px;
        }

        form * {
            width: 100%;
        }

        input {
            text-transform: uppercase;
            margin-left: 2.5%;
            width: 95%;
            font-family: Courier New;
            border-radius: 10px;
            box-shadow: inset 0 0 5px tomato;
            border: none;
            text-indent: 8px;
        }

        h1 {
            font-weight: bold;
            font-size: xxx-large;
            text-align: center;
        }

        #userInput {
            font-size: x-large;
        }

        #submitBtn {
            font-size: xx-large;
            font-family: Courier New;
            font-weight: bold;
            color: white;
            background: tomato;
            border-top: 4px solid white;
            border-left: 4px solid white;
            border-right: 4px solid red;
            border-bottom: 4px solid red;
            border-radius: 10px;
            margin: 2%;
            width: 96%;
        }

        #submitBtn:hover {
            background-color: brown;
            color: bisque;
        }

        #result {
            text-align: center;
            text-transform: uppercase;
            margin-left: 2%;
            width: 94.5%;
            font-family: Courier New;
            border-radius: 10px;
            box-shadow: inset 0 0 5px tomato;
            border: none;
            margin-bottom: 2%;
            padding: 1%;
            display: none;
            font-size: xx-large;
            word-wrap: break-word;
        }

        p {
            margin-left: 2.5%;
            width: 100%;
            padding: 0;
            margin: 0px;
            display: block;
            margin-left: 25px;
            font-weight: bold;
        }

        #copyBtn {
            font-size: large;
            font-family: Courier New;
            font-weight: bold;
            color: white;
            background: tomato;
            border-top: 4px solid white;
            border-left: 4px solid white;
            border-right: 4px solid red;
            border-bottom: 4px solid red;
            border-radius: 10px;
            margin: 2%;
            width: 64px;
        }

        #toast {
            visibility: hidden;
            min-width: 120px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.4s, visibility 0.4s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1>wrdhelpr</h1>

    <!-- Original Missing Letters Tool -->
    <form id="userInputForm">
        <p>Enter the letters in your game</p>
        <input type="text" id="userInput" name="userInput">
        <input type="submit" value="GO!" id="submitBtn">
        <div id="result"></div>
        <button type="button" id="copyBtn" style="display: none;">📋COPY</button>
    </form>

    <div id="toast">Copied!</div>

    <script>
        function initApp() {
            const userInputField = document.getElementById("userInput");
            if (!userInputField) return;

            userInputField.addEventListener("keyup", function () {
                let cleanedInput = this.value.toUpperCase().replace(/[^A-Z]/g, "");
                this.value = cleanedInput;
            });

            document.getElementById("userInputForm").addEventListener("submit", function (event) {
                event.preventDefault();

                const userInput = userInputField.value;
                const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                let missingLetters = "";

                for (let i = 0; i < alphabet.length; i++) {
                    if (userInput.indexOf(alphabet[i]) === -1) {
                        missingLetters += alphabet[i];
                    }
                }

                const resultDiv = document.getElementById("result");
                resultDiv.textContent = missingLetters;
                resultDiv.style.display = "block";

                const copyBtn = document.getElementById("copyBtn");
                copyBtn.style.display = "inline-block";
            });

            document.getElementById("copyBtn").addEventListener("click", function () {
                const resultText = document.getElementById("result").textContent;
                navigator.clipboard
                    .writeText(resultText)
                    .then(() => showToast("Copied to clipboard!"))
                    .catch((err) => console.error("Copy failed:", err));
            });

            function showToast(message) {
                const toast = document.getElementById("toast");
                toast.textContent = message;
                toast.classList.add("show");
                setTimeout(() => {
                    toast.classList.remove("show");
                }, 2000);
            }
        }

        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
